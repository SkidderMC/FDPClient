        attributes.attribute(Attribute.of("org.gradle.jvm.environment", String), "standard-jvm")
    }
    include {
        attributes.attribute(Attribute.of("org.gradle.jvm.environment", String), "standard-jvm")
    }
}

tasks.reobfShadowJar.mustRunAfter("shadowJar")
// jar is disabled above; only the shaded artifact may own production reobfuscation.
tasks.reobfJar.enabled = false
tasks.assemble.dependsOn("reobfShadowJar")

// The separate Lunar agent can carry Java 11 scripting classes; the Forge mod remains Java 8.
tasks.register("lunarScriptsJar", com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveClassifier.set("lunar-scripts")
    destinationDirectory.set(file("${buildDir}/lunar-engine"))
    configurations = [project.configurations.lunarScriptEngine]
    exclude "META-INF/*.SF", "META-INF/*.RSA", "META-INF/*.DSA", "module-info.class", "META-INF/versions/**"
    relocate "org.objectweb.asm", "net.ccbluex.liquidbounce.libraries.lunar.scriptAsm"
}

tasks.register("lunarAgentJar", com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    group = "build"
    description = "Builds the small early-start agent for Lunar, alongside the unchanged Forge mod JAR."
    dependsOn("reobfShadowJar", "lunarScriptsJar")
    archiveFileName.set("fdpclient-inject-bootstrap.jar")
    destinationDirectory.set(file("${buildDir}/lunar-engine"))
    doFirst {
        delete fileTree(file("${buildDir}/libs")) {
            include "${archivesBaseName}-*-lunar-agent.jar", "${archivesBaseName}-*-lunar.jar"
        }
    }
    configurations = []
    exclude "META-INF/*.SF", "META-INF/*.RSA", "META-INF/*.DSA"
    exclude "module-info.class", "META-INF/versions/**"
    from sourceSets.lunarEngine.output
    from(sourceSets.lunar.output) { include "net/ccbluex/liquidbounce/injection/bootstrap/**" }
    from({ zipTree(tasks.lunarScriptsJar.archiveFile.get().asFile) }) { exclude "META-INF/MANIFEST.MF" }
    from({ project.configurations.lunarAsm.collect { zipTree(it) } }) { exclude "META-INF/MANIFEST.MF" }
    from({ project.configurations.lunarMixin.collect { zipTree(it) } }) {
        exclude "META-INF/MANIFEST.MF", "META-INF/services/**", "META-INF/versions/**"
        exclude "org/spongepowered/tools/**"
        exclude "org/spongepowered/asm/launch/MixinLaunchPlugin.class"
        exclude "org/spongepowered/asm/launch/MixinTransformationService.class"
        exclude "org/spongepowered/asm/launch/platform/container/ContainerHandleModLauncherEx*.class"
    }
    from({ project.configurations.lunarEngineLibraries.collect { zipTree(it) } }) {
        exclude "META-INF/MANIFEST.MF", "META-INF/services/**"
    }
    relocate "org.spongepowered.asm", "net.ccbluex.liquidbounce.libraries.mixin"
    relocate "org.objectweb.asm", "net.ccbluex.liquidbounce.libraries.asm"
    relocate "com.google.common", "net.ccbluex.liquidbounce.libraries.mixinGuava"
    relocate "com.google.gson", "net.ccbluex.liquidbounce.libraries.mixinGson"
    manifest.attributes(
        "Premain-Class": "net.ccbluex.liquidbounce.injection.bootstrap.LunarAgent",
        "Agent-Class": "net.ccbluex.liquidbounce.injection.bootstrap.LunarAgent",
        "Can-Redefine-Classes": "true",
        "Can-Retransform-Classes": "true",
        "FDP-Payload-File": "${archivesBaseName}-${project.version}.jar"
    )
}

tasks.build.dependsOn("lunarAgentJar")

tasks.register("lunarBundleJar", Jar) {
    group = "build"
    description = "Packages the current Lunar agent and its payload for ZAVZ native delivery."
    dependsOn("lunarAgentJar", "reobfShadowJar")
    archiveClassifier.set("lunar")
    archiveFileName.set("fdpclient-inject-${project.version}.jar")
    from({ zipTree(tasks.lunarAgentJar.archiveFile.get().asFile) }) { exclude "META-INF/MANIFEST.MF" }
    from(tasks.shadowJar.archiveFile) { rename { "FDPClient.jar" } }
    manifest.attributes(
        "Premain-Class": "net.ccbluex.liquidbounce.injection.bootstrap.LunarAgent",
        "Agent-Class": "net.ccbluex.liquidbounce.injection.bootstrap.LunarAgent",
        "Can-Redefine-Classes": "true",
        "Can-Retransform-Classes": "true",
        "FDP-Lunar-Bundle": "1.8.9",
        "FDP-Payload-Resource": "FDPClient.jar",
        "FDP-Lunar-Runtime-Attach": "true"
    )
}
tasks.build.dependsOn("lunarBundleJar")

// Keep the optional sibling ZAVZ checkout on the same payload after every build.
tasks.register("stageLunarForZavz", Copy) {
    group = "build"
    description = "Updates the current Lunar bundle in an existing YZYInjector checkout."
    dependsOn("lunarBundleJar")
    def zavz = file(findProperty("zavzDir") ?: "../YZYInjector")
    onlyIf { new File(zavz, "src-tauri/Cargo.toml").isFile() }
    from(tasks.lunarBundleJar.archiveFile) { rename { "fdpclient-inject.jar" } }
    into(new File(zavz, "src/load"))
}
tasks.build.dependsOn("stageLunarForZavz")

tasks.register("verifyLunarShadedBridge", JavaExec) {
    group = "verification"
    description = "Runs the injection checks against the actual shaded agent, including descriptor relocation."
    dependsOn("lunarAgentJar", "lunarTestClasses")
    classpath = files(tasks.lunarAgentJar.archiveFile) + sourceSets.lunarTest.runtimeClasspath
    main = "net.ccbluex.liquidbounce.injection.bootstrap.LunarBridgeVerification"
}
check.dependsOn("verifyLunarShadedBridge")

tasks.register("writeSmokeClasspath") {
    group = "verification"
    description = "Writes the mapped compile classpath for real-game compatibility probes."
    def output = file("${buildDir}/smoke-classpath.txt")
    outputs.file(output)
    doLast { output.text = sourceSets.main.compileClasspath.asPath }
}

tasks.register('copyZipInclude', Copy) {
    from 'zip_include/'
    into 'build/libs/zip'
}

tasks.build.dependsOn("copyZipInclude")
