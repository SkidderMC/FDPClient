tasks.register("verifyBundledLibraries") {
    group = "verification"
    description = "Verifies every bundled library against the tracked SHA-256 provenance manifest."

    def checksumFile = file("libs/checksums.sha256")
    inputs.file(checksumFile)
    inputs.files(fileTree("libs") { include "*.jar" })

    doLast {
        if (!checksumFile.isFile()) {
            throw new GradleException("Missing bundled-library checksum manifest: ${checksumFile}")
        }

        def expected = [:]
        checksumFile.eachLine("UTF-8") { rawLine ->
            def line = rawLine.trim()
            if (!line || line.startsWith("#")) return
            def matcher = line =~ /^([0-9a-fA-F]{64})\s{2}(.+)$/
            if (!matcher.matches()) {
                throw new GradleException("Malformed checksum manifest line: ${rawLine}")
            }
            expected[matcher.group(2)] = matcher.group(1).toLowerCase(Locale.ROOT)
        }

        def jars = fileTree("libs") { include "*.jar" }.files.sort { it.name }
        def actualNames = jars.collect { it.name } as Set
        if (actualNames != expected.keySet()) {
            throw new GradleException("Bundled-library manifest mismatch. jars=${actualNames}, manifest=${expected.keySet()}")
        }

        jars.each { jarFile ->
            def digest = java.security.MessageDigest.getInstance("SHA-256")
            jarFile.withInputStream { input ->
                byte[] buffer = new byte[64 * 1024]
                int read
                while ((read = input.read(buffer)) >= 0) {
                    if (read > 0) digest.update(buffer, 0, read)
                }
            }
            def actual = digest.digest().collect { String.format("%02x", it & 0xff) }.join()
            if (actual != expected[jarFile.name]) {
                throw new GradleException("SHA-256 mismatch for bundled library ${jarFile.name}")
            }
        }
    }
}

check.dependsOn("verifyBundledLibraries")

shadowJar {
    exclude "META-INF/*.SF", "META-INF/*.RSA", "META-INF/*.DSA"
    from sourceSets.lunar.output
    // Forge's Mixin remapper must share Forge's org.objectweb.asm type identity.
    // The Lunar runtime copy and its separate agent isolate ASM instead.
    archiveClassifier.set("")
    duplicatesStrategy DuplicatesStrategy.EXCLUDE

    exclude "LICENSE.txt"
    exclude "module-info.class"

    exclude "META-INF/maven/**"
    exclude "META-INF/versions/**"

    exclude "org/apache/log4j/**"
    exclude "org/apache/logging/log4j/**"
    exclude "org/apache/commons/**"
    exclude "org/junit/**"

    // FML scans every .class entry with ASM 5, which rejects class files newer than Java 8
    // (major > 52) and then ignores the WHOLE mod jar. Fail the build instead.
    doLast {
        def packagedClient = archiveFile.get().asFile
        project.javaexec {
            classpath = sourceSets.lunar.output + project.configurations.lunarAsm
            main = "net.ccbluex.liquidbounce.injection.bootstrap.McefJarCompat"
            args packagedClient.absolutePath
        }
        def badClasses = []
        def zip = new java.util.zip.ZipFile(archiveFile.get().asFile)
        try {
            zip.entries().each { entry ->
                if (!entry.name.endsWith(".class")) return
                def input = zip.getInputStream(entry)
                try {
                    byte[] header = new byte[8]
                    int offset = 0
                    while (offset < 8) {
                        int read = input.read(header, offset, 8 - offset)
                        if (read < 0) break
                        offset += read
                    }
                    if (offset == 8) {
                        int major = ((header[6] & 0xff) << 8) | (header[7] & 0xff)
                        if (major > 52) {
                            badClasses << "${entry.name} (class file major version ${major})"
                        }
                    }
                } finally {
                    input.close()
                }
            }
        } finally {
            zip.close()
        }

        if (!badClasses.isEmpty()) {
            throw new GradleException(
                "Fat jar contains classes newer than Java 8; FML/ASM5 would ignore the whole jar at runtime:\n" +
                badClasses.take(20).join("\n")
            )
        }
    }
}

