plugins {
    id "java"
    id "idea"
    id "org.jetbrains.kotlin.jvm"
    id "io.gitlab.arturbosch.detekt"
    id "com.github.johnrengelman.shadow" version "6.1.0"
    id "net.minecraftforge.gradle.forge"
    id "org.spongepowered.mixin"
    id "com.gorylenko.gradle-git-properties" version "2.4.1"
}

repositories {
    mavenCentral()
    maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
    maven { url = "https://repo.spongepowered.org/maven/" }
    maven { url = "https://jitpack.io/" }
}

// ForgeGradle prepends Forge's Maven mirror. Resolve ordinary libraries from their
// publishers instead: large Kotlin downloads from that mirror can be truncated.
repositories.all { repository ->
    if (repository instanceof MavenArtifactRepository && repository.url.host == "maven.minecraftforge.net") {
        repository.content {
            includeGroupByRegex "net\\.minecraftforge(\\..*)?"
            includeGroupByRegex "de\\.oceanlabs(\\..*)?"
            includeGroup "net.minecraft"
        }
    }
}

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

sourceCompatibility = targetCompatibility = 1.8
compileJava.options.encoding = "UTF-8"

detekt {
    source = files("src/main/java")
    buildUponDefaultConfig = true
    config.setFrom(files("config/detekt/detekt.yml"))
    parallel = true
    baseline = file("config/detekt/baseline.xml")
}

tasks.withType(io.gitlab.arturbosch.detekt.Detekt).configureEach {
    jvmTarget = "1.8"
    reports {
        html.required.set(true)
        xml.required.set(true)
        sarif.required.set(true)
    }
}

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    mappings = "stable_22"
    makeObfSourceJar = false
    clientJvmArgs += ["-Dfml.coreMods.load=net.ccbluex.liquidbounce.injection.forge.MixinLoader", "-Xmx4096m", "-Xms1024m", "-XX:+UseG1GC", "-Ddev-mode"]

    def spotifyClientId = (project.findProperty("spotify_client_id") ?: "").toString()
    def spotifyClientSecret = (project.findProperty("spotify_client_secret") ?: "").toString()
    def spotifyRefreshToken = (project.findProperty("spotify_refresh_token") ?: "").toString()
    def spotifyPollInterval = (project.findProperty("spotify_poll_interval_seconds") ?: "5").toString()
    def spotifyHttpTimeout = (project.findProperty("spotify_http_timeout_ms") ?: "12000").toString()
    def spotifyDashboardUrl = (project.findProperty("spotify_dashboard_url") ?: "https://developer.spotify.com/dashboard").toString()
    def spotifyAuthGuideUrl = (project.findProperty("spotify_authorization_guide_url") ?: "https://developer.spotify.com/documentation/web-api/tutorials/refreshing-tokens").toString()
    def spotifyAuthScopes = (project.findProperty("spotify_authorization_scopes") ?: "user-read-currently-playing user-read-playback-state user-modify-playback-state playlist-read-private playlist-read-collaborative user-library-read").toString()
    def spotifyAuthRedirectPort = (project.findProperty("spotify_authorization_redirect_port") ?: "43791").toString()
    def spotifyAuthRedirectPath = (project.findProperty("spotify_authorization_redirect_path") ?: "/spotify-oauth-callback").toString()

    clientJvmArgs += [
            "-Dspotify.clientId=${spotifyClientId}",
            "-Dspotify.clientSecret=${spotifyClientSecret}",
            "-Dspotify.refreshToken=${spotifyRefreshToken}",
            "-Dspotify.pollIntervalSeconds=${spotifyPollInterval}",
            "-Dspotify.httpTimeoutMs=${spotifyHttpTimeout}",
            "-Dspotify.dashboardUrl=${spotifyDashboardUrl}",
            "-Dspotify.authorizationGuideUrl=${spotifyAuthGuideUrl}",
            "-Dspotify.authorizationScopes=${spotifyAuthScopes}",
            "-Dspotify.authorizationRedirectPort=${spotifyAuthRedirectPort}",
            "-Dspotify.authorizationRedirectPath=${spotifyAuthRedirectPath}",
    ]
}

configurations {
    lunarMixin
    lunarEngineLibraries
    lunarAsm
    lunarScriptEngine
    external
    compile.extendsFrom(external)

    runtimeOnly.canBeResolved = true
}

// The injection boundary has no dependency on FDP's Kotlin classes or Forge initialization.
sourceSets {
    lunar {
        java.srcDir "src/lunar/java"
        compileClasspath += sourceSets.main.compileClasspath
    }
    lunarTest {
        java.srcDir "src/lunarTest/java"
        compileClasspath += sourceSets.lunar.output + sourceSets.lunar.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    lunarEngine {
        java.srcDir "src/lunarEngine/java"
        compileClasspath = configurations.lunarMixin + sourceSets.lunar.compileClasspath + sourceSets.lunar.output
    }
}

tasks.register("generateLunarEngineServices") {
    def directory = file("${buildDir}/generated/lunarEngine/META-INF/services")
    outputs.dir(directory)
    doLast {
        directory.mkdirs()
        new File(directory, "net.ccbluex.liquidbounce.libraries.mixin.service.IMixinService").text =
            "net.ccbluex.liquidbounce.injection.lunar.engine.RuntimeMixinService\n"
        new File(directory, "net.ccbluex.liquidbounce.libraries.mixin.service.IGlobalPropertyService").text =
            "net.ccbluex.liquidbounce.injection.lunar.engine.RuntimeProperties\n"
    }
}
sourceSets.lunarEngine.resources.srcDir("${buildDir}/generated/lunarEngine")
tasks.named("processLunarEngineResources") { dependsOn("generateLunarEngineServices") }

sourceSets.main.compileClasspath += sourceSets.lunar.output
sourceSets.main.runtimeClasspath += sourceSets.lunar.output
sourceSets.test.runtimeClasspath += sourceSets.lunar.output

tasks.register("generateLunarMixins") {
    def source = file("src/main/resources/fdpclient.forge.mixins.json")
    def output = file("${buildDir}/generated/lunar/fdpclient.lunar.mixins.json")
    inputs.file(source)
    outputs.file(output)
    doLast {
        def config = new groovy.json.JsonSlurper().parse(source)
        config.minVersion = "0.8"
        config.refmap = "fdpclient.lunar.refmap.json"
        config.mixins.removeAll { it in ["gui.MixinGuiButtonExt", "gui.MixinGuiSlider"] }
        config.client.removeAll { it == "client.MixinMcefExampleMod" }
        config.injectors = [defaultRequire: 0]
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config))
    }
}

sourceSets.lunar.resources.srcDir("${buildDir}/generated/lunar")
tasks.named("processLunarResources") { dependsOn("generateLunarMixins") }
tasks.named("compileKotlin") { dependsOn("lunarClasses") }
tasks.named("compileJava") { dependsOn("lunarClasses") }

