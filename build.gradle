    group = "verification"
    description = "Checks Lunar mapping parsing, bytecode adaptation and payload class-loader isolation."
    dependsOn("lunarTestClasses")
    classpath = sourceSets.lunarTest.runtimeClasspath
    main = "net.ccbluex.liquidbounce.injection.bootstrap.LunarBridgeVerification"
}

check.dependsOn("verifyLunarBridge")

