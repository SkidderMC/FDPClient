name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: gradle

      - name: Verify and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon setupCiWorkspace
          ./gradlew --no-daemon clean check build

      - name: Remember the Forge build JDK
        run: echo "FORGE_BUILD_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify runtime attachment on Java 17
        run: JAVA_HOME="$FORGE_BUILD_JAVA_HOME" ./gradlew --no-daemon verifyLunarLate "-PlunarJavaExecutable=$JAVA_HOME/bin/java"

      - name: Name the inject build
        id: inject
        run: |
          VERSION="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties | tr -d '[:space:]')"
          test -n "$VERSION"
          FILE="build/inject/fdpclient-inject-${VERSION}-${GITHUB_SHA::7}.jar"
          mkdir -p build/inject
          cp "build/libs/fdpclient-inject-${VERSION}.jar" "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: FDPClient-${{ github.sha }}
          path: build/libs/FDPClient-*.jar
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.inject.outputs.file }}
          archive: false
          if-no-files-found: error
